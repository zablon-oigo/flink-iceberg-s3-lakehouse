name: Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate short SHA
        id: sha
        run: echo "sha=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and push data-generator
        uses: docker/build-push-action@v5
        with:
          context: ./data
          push: true
          tags: |
            ${{ vars.DATA_GENERATOR_IMAGE }}:${{ steps.sha.outputs.sha }}
            ${{ vars.DATA_GENERATOR_IMAGE }}:latest

      - name: Build and push flink-iceberg
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ vars.FLINK_ICEBERG_IMAGE }}:${{ steps.sha.outputs.sha }}
            ${{ vars.FLINK_ICEBERG_IMAGE }}:latest